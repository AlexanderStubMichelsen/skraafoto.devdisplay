name: Deploy Flask + React to Linux Server

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No secrets in the frontend build: src/util/configuration.js is committed and
      # points at the Flask proxy, which holds the credentials server-side.
      - name: Build React frontend
        run: |
          npm install
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Prepare files for deployment
        run: |
          echo "Working directory: $(pwd)"
          ls -alh

          mkdir -p deploy

          if [ -d dist ]; then
            cp -r dist/* deploy/
          else
            echo "⚠️ dist/ folder not found, skipping frontend copy."
          fi

          [ -f postgress_connector.py ] && cp postgress_connector.py deploy/
          [ -f requirements.txt ] && cp requirements.txt deploy/
          [ -f skraafoto.wsgi ] && cp skraafoto.wsgi deploy/
          [ -f .env ] && cp .env deploy/

          echo "📁 Final deploy folder contents:"
          ls -alh deploy/

      - name: Deploy via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 172.105.95.18
          username: root
          key: ${{ secrets.DEPLOY_KEY }}
          source: "deploy/*"
          target: "/var/www/skraafoto"
          strip_components: 1

      - name: Write backend secrets and restart Apache
        uses: appleboy/ssh-action@master
        with:
          host: 172.105.95.18
          username: root
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            # Kept outside the web root so Apache can never serve it
            mkdir -p /etc/skraafoto
            umask 077
            cat > /etc/skraafoto/secrets.env << 'EOF'
            DATAFORSYNINGEN_TOKEN=${{ secrets.VITE_API_TOKEN }}
            DHM_USERNAME=${{ secrets.VITE_API_DHM_TOKENA }}
            DHM_PASSWORD=${{ secrets.VITE_API_DHM_TOKENB }}
            EOF
            sed -i 's/^[[:space:]]*//' /etc/skraafoto/secrets.env
            # Let the Apache (mod_wsgi) user read it
            if getent group www-data > /dev/null; then
              chown root:www-data /etc/skraafoto /etc/skraafoto/secrets.env
              chmod 750 /etc/skraafoto
              chmod 640 /etc/skraafoto/secrets.env
            else
              chmod 755 /etc/skraafoto
              chmod 644 /etc/skraafoto/secrets.env
            fi
            sudo systemctl restart apache2
