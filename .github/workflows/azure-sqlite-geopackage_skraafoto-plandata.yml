name: Build and deploy Python app to Azure Web App - skraafoto-plandata

on:
  push:
    branches:
      - Azure-SQLite-GeoPackage
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ✅ Checkout repository and include Git LFS files (for your GeoPackage)
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      # ✅ Ensure LFS data (like .gpkg) is pulled down
      - name: Pull LFS files
        run: |
          git lfs install
          git lfs pull
          ls -lh plandata.gpkg || echo "⚠️ GeoPackage not found"

      # ✅ Set up Python
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ✅ Install dependencies directly into app directory (so Azure runtime finds them)
      - name: Install dependencies into app directory
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt --target="./"
          ls -lh | grep pyproj || echo "pyproj not found"

      # ✅ Create frontend configuration from GitHub Secrets (so tokens are injected at build time)
      - name: Create frontend configuration file
        run: |
          mkdir -p src/util
          cat > src/util/configuration.js << 'EOF'
          export const configuration = {
            // app expects both api_base_url and API_STAC_TOKEN in the bundle
            api_base_url: 'https://skraafoto-plandata-ckardphtehdjc5ar.westeurope-01.azurewebsites.net',
            API_STAC_BASEURL: 'https://api.dataforsyningen.dk/rest/skraafoto_api/v1.0',
            API_STAC_TOKEN: '${{ secrets.VITE_API_TOKEN }}',
            API_DHM_BASEURL: 'https://services.datafordeler.dk/DHMTerraen/DHMKoter/1.0.0/GEOREST/',
            API_DHM_TOKENA: '${{ secrets.VITE_API_DHM_TOKENA }}',
            API_DHM_TOKENB: '${{ secrets.VITE_API_DHM_TOKENB }}'
          }
          EOF

      # ✅ Build frontend so configuration is bundled into dist
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and build frontend
        working-directory: ./
        run: |
          npm install --no-audit --no-fund
          npm run build

      # ✅ Package everything for Azure deployment
      - name: Sanity-check deployment artifacts
        run: |
          echo "Dist contents:"
          ls -alh dist || echo "dist/ not found"
          echo "Config file:"
          ls -alh src/util/configuration.js || echo "configuration.js not found"
          echo "Repo size:"
          du -sh . || true

      - name: Create deployment ZIP (excluding node_modules)
        run: |
          zip -r deploy.zip . -x ".git/*" ".github/*" "__pycache__/*" "antenv/*" "node_modules/*" "node_modules/**"

      # ✅ Upload ZIP artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: deploy.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_AC7A19752006419F83D9A5308DBBBCB8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_25BA7C8F94024606B904893E1FB72324 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DD74700945D346EBB597564674EA99FB }}

      # ✅ Deploy ZIP package to your Flask app
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "skraafoto-plandata"
          package: deploy.zip
          type: zip
          clean: true
